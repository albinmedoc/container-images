name: Build and Push OpenMAIC

on:
  workflow_dispatch:
    inputs:
      version:
        description: OpenMAIC tag or branch to build
        required: true
        default: v1.0.0
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  packages: write

env:
  # renovate: datasource=github-tags depName=THU-MAIC/OpenMAIC
  OPENMAIC_VERSION: v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Select OpenMAIC version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${OPENMAIC_VERSION}}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout OpenMAIC
        uses: actions/checkout@v7
        with:
          repository: THU-MAIC/OpenMAIC
          ref: ${{ steps.version.outputs.version }}
          path: openmaic

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: openmaic
          file: openmaic/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/openmaic:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/openmaic:latest
          build-args: |
            OPENMAIC_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=openmaic
          cache-to: type=gha,mode=max,scope=openmaic